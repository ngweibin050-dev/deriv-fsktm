                              h('p', { className: 'mt-1 text-xs leading-relaxed text-slate-400' }, c.description)
                            )
                          )
                        ),
                        needsSnacksCovered
                          ? h(
                              'div',
                              { className: 'flex items-start gap-3 rounded-xl border-2 border-[#FF444F] bg-[#FF444F]/10 p-3.5' },
                              h(Sparkles, { className: 'mt-0.5 h-4 w-4 shrink-0 text-[#FF444F]' }),
                              h(
                                'div',
                                { className: 'flex-1' },
                                h(
                                  'span',
                                  { className: 'inline-flex items-center rounded-full bg-[#FF444F] px-2.5 py-0.5 text-xs font-bold text-white' },
                                  '+ Refreshments & Pizza Covered by Deriv'
                                ),
                                h(
                                  'p',
                                  { className: 'mt-1.5 text-xs leading-relaxed text-slate-200' },
                                  'Since your club left refreshments unchecked, Deriv will directly sponsor food and drinks for all registered student builders.'
                                )
                              )
                            )
                          : h(
                              'div',
                              { className: 'rounded-xl border border-emerald-500/40 bg-emerald-950/40 px-3.5 py-2.5 text-xs text-emerald-300 font-medium' },
                              'Your club is handling snacks — Deriv will redirect extra budget into bonus hackathon prizes!'
                            )
                      )
                    )
                  )
                )
              )
            ),
            // FAQ Accordion
            h(
              'section',
              { id: 'faq', className: 'py-12 sm:py-16 border-b border-slate-800/80 print-compact' },
              h(
                'div',
                { className: 'mx-auto max-w-3xl px-4 sm:px-6' },
                h(
                  'span',
                  { className: 'inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#FF444F]' },
                  h(HelpCircle, { className: 'h-3.5 w-3.5' }),
                  'COMMITTEE LOGISTICS'
                ),
                h('h2', { className: 'mt-1 font-heading text-2xl font-extrabold text-white sm:text-3xl' }, 'Questions Your Advisor & Exco Will Ask'),
                h(
                  'div',
                  { className: 'mt-6 space-y-3' },
                  FAQ_ITEMS.map((item, idx) => {
                    const isOpen = openFaq === idx;
                    return h(
                      'div',
                      { key: item.id, className: 'overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/80 print-card' },
                      h(
                        'button',
                        {
                          type: 'button',
                          onClick: () => setOpenFaq(isOpen ? null : idx),
                          className:
                            'flex w-full items-center justify-between gap-4 px-5 py-4 text-left font-heading text-sm font-bold text-white hover:bg-slate-800/60 sm:text-base',
                        },
                        h('span', null, item.question),
                        h(ChevronDown, {
                          className: `h-4 w-4 shrink-0 text-slate-400 transition-transform duration-200 no-print ${
                            isOpen ? 'rotate-180 text-[#FF444F]' : ''
                          }`,
                        })
                      ),
                      isOpen &&
                        h(
                          'div',
                          { className: 'px-5 pb-4 text-sm leading-relaxed text-slate-300' },
                          h('p', { className: 'max-w-prose border-t border-slate-800 pt-3' }, item.answer)
                        )
                    );
                  })
                )
              )
            ),
            // First Step Form (Dark Theme)
            h(
              'section',
              { id: 'first-step', className: 'py-12 sm:py-16 print-compact' },
              h(
                'div',
                { className: 'mx-auto max-w-3xl px-4 sm:px-6' },
                h(
                  'div',
                  { className: 'rounded-2xl border border-slate-800 bg-slate-900/90 p-6 shadow-2xl backdrop-blur-sm sm:p-8 print-card' },
                  h('h2', { className: 'font-heading text-2xl font-extrabold text-white sm:text-3xl' }, 'One Simple First Step'),
                  h(
                    'p',
                    { className: 'mt-2 max-w-prose text-sm leading-relaxed text-slate-300 sm:text-base' },
                    'No lengthy proposal deck required. Share your club name and target month to lock in a quick 15-minute alignment call with our Malaysia campus team.'
                  ),
                  h(
                    'div',
                    { className: 'mt-6 no-print' },
                    !isSubmitted
                      ? h(
                          'form',
                          { onSubmit: handleSubmit, noValidate: true, className: 'space-y-4' },
                          h(
                            'div',
                            { className: 'grid grid-cols-1 gap-4 sm:grid-cols-3' },
                            h(
                              'div',
                              null,
                              h('label', { className: 'block text-xs font-bold uppercase tracking-wide text-slate-300' }, '1. Club / Society Name'),
                              h('input', {
                                type: 'text',
                                value: clubName,
                                onChange: (e) => setClubName(e.target.value),
                                placeholder: 'e.g., PEKOM, GDGoC UM, AI Club',
                                className:
                                  'mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-[#FF444F] focus:outline-none',
                              })
                            ),
                            h(
                              'div',
                              null,
                              h('label', { className: 'block text-xs font-bold uppercase tracking-wide text-slate-300' }, '2. Target Month'),
                              h('input', {
                                type: 'text',
                                list: 'preview-months',
                                value: targetMonth,
                                onChange: (e) => setTargetMonth(e.target.value),
                                placeholder: 'e.g., Dec 2026 / Sem 2',
                                className:
                                  'mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-[#FF444F] focus:outline-none',
                              }),
                              h(
                                'datalist',
                                { id: 'preview-months' },
                                TARGET_MONTH_SUGGESTIONS.map((m) => h('option', { key: m, value: m }))
                              )
                            ),
                            h(
                              'div',
                              null,
                              h('label', { className: 'block text-xs font-bold uppercase tracking-wide text-slate-300' }, '3. Organizer Email'),
                              h('input', {
                                type: 'email',
                                value: organizerEmail,
                                onChange: (e) => setOrganizerEmail(e.target.value),
                                placeholder: 'name@siswa.um.edu.my',
                                className:
                                  'mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-[#FF444F] focus:outline-none',
                              })
                            )
                          ),
                          errorMessage &&
                            h(
                              'p',
                              {
                                className:
                                  'rounded-lg border border-[#FF444F]/40 bg-[#FF444F]/15 px-3.5 py-2 text-xs font-medium text-[#FF444F]',
                              },
                              errorMessage
                            ),
                          h(
                            'div',
                            { className: 'flex justify-end pt-2' },
                            h(
                              'button',
                              {
                                type: 'submit',
                                className:
                                  'inline-flex items-center justify-center gap-2 rounded-xl bg-[#FF444F] px-6 py-3 text-sm font-bold text-white shadow-lg shadow-[#FF444F]/20 hover:bg-[#E63540]',
                              },
                              h(Send, { className: 'h-4 w-4' }),
                              h('span', null, 'Prepare 15-Min Intro Request')
                            )
                          )
                        )
                      : h(
                          'div',
                          { className: 'rounded-xl border border-slate-800 bg-slate-950 p-5 shadow-sm' },
                          h(
                            'div',
                            { className: 'flex items-center justify-between border-b border-slate-800 pb-3' },
                            h('h3', { className: 'font-heading text-sm font-bold text-white' }, `Ready to Send — ${trimmedClub} × Deriv`),
                            h(
                              'button',
                              {
                                type: 'button',
                                onClick: () => setIsSubmitted(false),
                                className: 'inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-white',
                              },
                              h(Edit3, { className: 'h-3 w-3' }),
                              h('span', null, 'Edit details')
                            )
                          ),
                          h(
                            'div',
                            {
                              className:
                                'mt-3 rounded-lg border border-slate-800 bg-slate-900/90 p-3.5 font-mono text-xs leading-relaxed text-slate-200 whitespace-pre-wrap',
                            },
                            outreachMessage
                          ),
                          h(
                            'div',
                            { className: 'mt-4 flex flex-col gap-3 sm:flex-row' },
                            h(
                              'a',
                              {
                                href: mailtoHref,
                                className:
                                  'inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-[#FF444F] px-5 py-3 text-xs font-bold text-white shadow-lg shadow-[#FF444F]/20 hover:bg-[#E63540] sm:text-sm',
                              },
                              h(Mail, { className: 'h-4 w-4' }),
                              h('span', null, 'Open in Email App')
                            ),
                            h(
                              'button',
                              {
                                type: 'button',
                                onClick: handleCopy,
                                className:
                                  'inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-900 px-5 py-3 text-xs font-bold text-white shadow-sm hover:bg-slate-800 sm:text-sm',
                              },
                              copied
                                ? h('span', { className: 'text-emerald-400' }, 'Copied!')
                                : h('span', null, 'Copy Message for WhatsApp / Committee')
                            )
                          )
                        )
                  )
                )
              )
            )
          ),
          // Footer
          h(
            'footer',
            { className: 'border-t border-slate-800/80 bg-slate-950 py-8 text-xs text-slate-400' },
            h(
              'div',
              { className: 'mx-auto flex max-w-5xl flex-col sm:flex-row items-start sm:items-center justify-between gap-4 px-4 sm:px-6' },
              h(
                'div',
                { className: 'flex items-center gap-3' },
                h('img', {
                  src: BRAND_ASSETS.derivIcon,
                  alt: 'Deriv',
                  onDoubleClick: () => openOnDoubleClick(EXTERNAL_LINKS.derivWebsite),
                  title: 'Double-click to visit deriv.com',
                  className: 'h-7 w-7 cursor-pointer rounded-md object-cover',
                }),
                h(
                  'div',
                  null,
                  h('p', { className: 'font-bold text-slate-200' }, 'Deriv Services Malaysia Sdn. Bhd. · University & Developer Relations'),
                  h(
                    'a',
                    {
                      href: EXTERNAL_LINKS.derivHqMap,
                      target: '_blank',
                      rel: 'noreferrer',
                      className: 'mt-0.5 flex items-center gap-1 text-slate-400 hover:text-[#FF444F]',
                    },
                    h(MapPin, { className: 'h-3 w-3 text-[#FF444F] shrink-0' }),
                    h('span', null, 'Deriv HQ, 3500, Jalan Teknokrat 3, 63000 Cyberjaya, Selangor, Malaysia')
                  )
                )
              ),
              h(
                'div',
                { className: 'flex flex-wrap items-center gap-4 no-print' },
                h('a', { href: EXTERNAL_LINKS.derivApi, target: '_blank', rel: 'noreferrer', className: 'font-medium text-slate-300 hover:text-[#FF444F]' }, 'api.deriv.com'),
                h('span', { className: 'text-slate-600' }, '·'),
                h('a', { href: EXTERNAL_LINKS.derivHackathon, target: '_blank', rel: 'noreferrer', className: 'font-medium text-slate-300 hover:text-[#FF444F]' }, 'deriv.com/hackathon'),
                h('span', { className: 'text-slate-600' }, '·'),
                h('a', { href: EXTERNAL_LINKS.fsktmWebsite, target: '_blank', rel: 'noreferrer', className: 'font-medium text-slate-300 hover:text-[#FF444F]' }, 'fsktm.um.edu.my')
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    </script>
  </body>
</html>
